<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juan Fajardo · Simulador de planta</title>


<meta name="color-scheme" content="only light">

<style>
:root{
  --bg:#eef2f8; --bg2:#f6f9fd; --panel:#ffffff; --panel2:#f6f9fd; --panel3:#e8f1ff;
  --line:#e6ecf4; --line2:#d3dce9; --ink:#12233a; --ink2:#35506e; --ink3:#586b82;
  --acc:#1f6feb; --acc2:#1858bd;
  --ok:#15803d; --am:#c77700; --ro:#d6452a; --ro2:#d6452a;
  --crudo:#c98b12; --gas:#4f9bd9; --agua:#1f8fd1; --multi:#a86a2c; --quim:#9b5de5; --aire:#e2e8f0;
  --A1:#f2a900; --A2:#27a9e1; --A3:#2fb67a;
  --mono:'Barlow','Segoe UI',system-ui,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
  --sans:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,h5{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#253a58;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-rows:54px minmax(0,1fr);height:100vh;min-height:640px}
.top{display:flex;align-items:center;gap:18px;padding:0 16px;background:linear-gradient(180deg,#0f1a2d,#0c1524);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:30px;height:30px}
.logo h1{font-size:18px;line-height:1.05}
.logo small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-left:10px}
.nav button{background:none;border:0;padding:8px 13px;border-radius:8px;color:var(--ink3);font-family:var(--cond);font-weight:600;font-size:14.5px;position:relative}
.nav button:hover{color:var(--ink);background:var(--panel)}
.nav button[aria-selected=true]{color:var(--ink);background:var(--panel2)}
.nav button[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:-9px;height:2px;background:var(--acc);border-radius:2px}
.nav button:disabled{opacity:.35;cursor:default}
.top-der{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.chip.ok{color:var(--ok);border-color:#1f5c48}.chip.am{color:var(--am);border-color:#6b5317}.chip.ro{color:var(--ro);border-color:#6d2232}
.firma{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-align:right;line-height:1.35}
.firma b{color:var(--ink2);font-weight:500}

main{min-height:0;position:relative;overflow:hidden}
.vista{position:absolute;inset:0;display:none}
.vista.activa{display:block;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* paneles */
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pnl>header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);min-height:38px}
.pnl>header h3{font-size:14px}
.pnl>header .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.pnl .cu{padding:10px 12px}
.pnl .cu.sin{padding:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.nota{font-size:12px;color:var(--ink3);line-height:1.45}
.aviso{border-left:3px solid var(--am);background:rgba(251,191,36,.07);padding:8px 10px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2)}
.aviso.ro{border-left-color:var(--ro);background:rgba(244,63,94,.08)}
.aviso.info{border-left-color:var(--acc);background:rgba(77,163,255,.07)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--acc);background:var(--panel3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04111f;font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn svg{width:15px;height:15px;fill:currentColor}

/* sliders */
.sl{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:2px 8px;align-items:center;padding:5px 0}
.sl label{font-size:12.5px;color:var(--ink2);line-height:1.25}
.sl label small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.sl input[type=number]{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-family:var(--mono);font-size:12px;text-align:right}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);height:16px;margin:0}
.sl.her label::after{content:attr(data-her);display:block;font-family:var(--mono);font-size:10px;color:var(--acc2)}
.sl.mod label{color:var(--am)}
.grp-t{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--ink);margin:12px 0 2px;display:flex;align-items:center;gap:6px}
.grp-t:first-child{margin-top:0}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.kpi b{display:block;font-family:var(--mono);font-size:20px;line-height:1.1}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.kpi.ok b{color:var(--ok)}.kpi.am b{color:var(--am)}.kpi.ro b{color:var(--ro)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bal div{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--ink3)}
.bal div.ro{border-left-color:var(--ro)}
.bal b{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}

.pre{display:flex;flex-wrap:wrap;gap:5px}
.pre button{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink2)}
.pre button:hover{border-color:var(--acc)}
.pre button.on{background:var(--acc);border-color:var(--acc);color:#04111f;font-weight:600}
.pre button.ideal{border-color:#1f5c48;color:var(--ok)}
.pre button.ideal.on{background:var(--ok);color:#04150e}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-family:var(--mono);font-size:10.5px;font-weight:500;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p0{color:var(--ok);background:rgba(52,211,153,.12)}.p1{color:var(--am);background:rgba(251,191,36,.12)}.p2{color:var(--ro);background:rgba(244,63,94,.14)}.pn{color:var(--ink3);background:rgba(123,142,168,.14)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px;background:var(--ink3)}
.dot.d0{background:var(--ok)}.dot.d1{background:var(--am)}.dot.d2{background:var(--ro);box-shadow:0 0 0 3px rgba(244,63,94,.25)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:500;background:var(--panel2);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tbody tr:hover{background:rgba(77,163,255,.05)}
tr.sel td{background:rgba(77,163,255,.1)}
.tw{overflow:auto}

/* ---------- PLANTA ---------- */
.planta{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;height:100%}
.lado{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);background:var(--bg2)}
.lado.der{border-right:0;border-left:1px solid var(--line)}
.lienzo{position:relative;min-width:0;min-height:0;background:radial-gradient(1200px 700px at 50% 40%,#0f1c31,#0a111d 70%)}
.lienzo svg#planta{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoomer{position:absolute;left:12px;top:12px;display:flex;gap:4px;z-index:3;background:rgba(13,22,38,.85);border:1px solid var(--line2);border-radius:10px;padding:4px;backdrop-filter:blur(6px)}
.zoomer button{border:0;background:none;border-radius:7px;padding:5px 11px;font-family:var(--cond);font-weight:600;font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.zoomer button i{width:9px;height:9px;border-radius:50%}
.zoomer button.on{background:var(--panel3);color:var(--ink)}
.leyenda{position:absolute;right:12px;top:12px;z-index:3;display:flex;gap:10px;flex-wrap:wrap;background:rgba(13,22,38,.85);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.leyenda span{display:flex;align-items:center;gap:5px}
.leyenda i{width:16px;height:3px;border-radius:2px}
.tip{position:absolute;pointer-events:none;z-index:6;background:rgba(10,17,29,.96);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:200px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:12px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip h4{font-size:14px;display:flex;align-items:center;gap:6px}
.tip p{margin:4px 0 0;color:var(--ink2)}
.tip .k{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:5px}
.banda{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg2)}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);display:grid;place-items:center;flex:0 0 36px}
.play svg{width:15px;height:15px;fill:#04111f}
.banda input[type=range]{flex:1;accent-color:var(--acc)}
.anio{font-family:var(--mono);font-size:20px;font-weight:600;min-width:120px;text-align:right}
.anio small{font-size:11px;color:var(--ink3)}
.velo{display:flex;gap:3px}
.velo button{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:3px 7px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.velo button.on{color:var(--ink);border-color:var(--acc)}
.alerta{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--am);border-radius:8px;background:var(--panel);cursor:pointer;transition:transform .12s,border-color .12s}
.alerta:hover{transform:translateX(2px);border-color:var(--line2)}
.alerta.s2{border-left-color:var(--ro)}
.alerta b{font-family:var(--cond);font-size:14px}
.alerta p{margin:1px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.35}
.alerta .ico{width:26px;height:26px;flex:0 0 26px}
.casc{font-size:12px;color:var(--ink2);display:grid;gap:5px}
.casc div{display:flex;gap:6px;align-items:baseline}
.casc .fl{color:var(--acc2);font-family:var(--mono)}

/* svg planta */
#planta .eq{cursor:pointer}
#planta .eq .hal{fill:none;stroke-width:2.5;opacity:0;transition:opacity .25s}
#planta .eq.s1 .hal{opacity:.9;stroke:var(--am)}
#planta .eq.s2 .hal{opacity:1;stroke:var(--ro);animation:late 1.1s ease-in-out infinite}
#planta .eq:hover .hal,#planta .eq.foco .hal{opacity:1;stroke:var(--acc)}
#planta .eq.dim{opacity:.28}
@keyframes late{0%,100%{stroke-opacity:1;stroke-width:2.5}50%{stroke-opacity:.35;stroke-width:6}}
#planta .lbl{font-family:var(--cond);font-weight:600;font-size:12px;fill:var(--ink2);pointer-events:none}
#planta .lbl.t{font-family:var(--mono);font-size:10px;font-weight:500;fill:var(--ink3)}
#planta .eq:hover .lbl,#planta .eq.foco .lbl{fill:#fff}
#planta .tubo{fill:none;stroke-linecap:round;stroke-linejoin:round}
#planta .flujo{fill:none;stroke-linecap:round;stroke-dasharray:3 14;animation:corre linear infinite}
@keyframes corre{to{stroke-dashoffset:-34}}
#planta .zona{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.08em}
#planta .ripple{fill:none;stroke-width:3;animation:rip 1.4s ease-out forwards;pointer-events:none}
@keyframes rip{from{r:8;opacity:1}to{r:70;opacity:0}}
.sdot{transition:fill .3s}
.gota{animation:gota 1.2s linear infinite}
@keyframes gota{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}
.humo{animation:humo 2.4s ease-out infinite}
@keyframes humo{0%{transform:translate(0,0) scale(.6);opacity:.7}100%{transform:translate(6px,-34px) scale(1.8);opacity:0}}
.llama{transform-box:fill-box;transform-origin:50% 100%;animation:llama .45s ease-in-out infinite alternate}
@keyframes llama{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.12) skewX(4deg)}}
.balancin{transform-box:view-box;animation:balancin 3.2s ease-in-out infinite alternate}
@keyframes balancin{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.giro{transform-box:fill-box;transform-origin:center;animation:giro 1.2s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.onda{animation:onda 3s ease-in-out infinite alternate}
.piston{animation:piston 1.6s ease-in-out infinite alternate}
@keyframes piston{from{transform:translateY(0)}to{transform:translateY(6px)}}
#planta .varilla{animation:varilla 3.2s ease-in-out infinite alternate}
@keyframes varilla{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes onda{from{transform:translateX(-6px)}to{transform:translateX(6px)}}

/* ---------- EQUIPO ---------- */
.equipo{display:grid;grid-template-columns:320px minmax(0,1fr) 330px;height:100%}
.eq-centro{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:12px;gap:12px}
.eq-centro>*{flex-shrink:0}
.equipo>.lado{min-height:0}
.eq-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.eq-cab h2{font-size:24px;line-height:1.1}
.eq-cab .sis{width:6px;height:40px;border-radius:4px}
.eq-cab p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.eq-cab .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.escena{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:radial-gradient(900px 500px at 50% 30%,#13223a,#0b1322 75%)}
.escena canvas{display:block;width:100%;height:440px}
.escena .hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.escena .hud .chip{background:rgba(10,17,29,.85)}
.escena .tl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
.escena .hud{bottom:62px!important}
.escena .tl input{flex:1;accent-color:var(--acc)}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--ink3);font-family:var(--cond);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabc{padding:12px 0 0}
canvas.ch{display:block;width:100%;height:260px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.pz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;transition:border-color .15s}
.pz:hover{border-color:var(--line2)}
.pz.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pz b{font-family:var(--mono);font-size:12px}
.pz .nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz select{grid-column:1/-1;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:11.5px}
.pz select.cambio{border-color:var(--am);color:var(--am)}
.pz .ca{grid-column:1/-1}
.chk{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.chk:last-child{border-bottom:0}
.chk .dot{margin-top:4px}
.dato{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.dato b{font-family:var(--mono);font-weight:500;color:var(--ink);text-align:right}
.lect{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.lect div{padding:7px 10px;border-right:1px solid var(--line)}
.lect div:last-child{border-right:0}
.lect b{display:block;font-family:var(--mono);font-size:14px}
.lect span{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.sol{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel)}
.sol.material{border-left-color:#22d3ee}.sol.diseño{border-left-color:#a78bfa}.sol.seguimiento{border-left-color:var(--ok)}
.sol .tg{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sol h5{font-size:14px;margin:2px 0}
.sol small{display:block;color:var(--ink3);margin-top:3px}
.flujo-io{display:grid;gap:6px}
.flujo-io .it{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:12px}
.flujo-io .it:hover{border-color:var(--acc)}
.flujo-io .it b{font-family:var(--mono);font-size:11.5px}
.flujo-io .it span{color:var(--ink3)}
.her{font-family:var(--mono);font-size:10.5px;color:var(--acc2)}
.ref{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.conf{font-family:var(--mono);font-size:10px;border-radius:999px;padding:0 7px;border:1px solid}
.conf.n{color:var(--ok);border-color:#1f5c48}.conf.t{color:var(--am);border-color:#6b5317}.conf.s{color:var(--ro2);border-color:#6d2232}

/* ---------- páginas ---------- */
.pag{height:100%;overflow:auto;padding:18px 22px 40px}
.pag .enc{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.pag .enc h2{font-size:24px}
.pag .enc p{color:var(--ink3);max-width:90ch;margin:4px 0 0}
.rej2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.rej3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.esc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s}
.esc:hover{border-color:var(--acc);transform:translateY(-2px)}
.esc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.esc.ideal{border-color:#1f5c48}
.esc h4{font-size:16px;display:flex;align-items:center;gap:8px}
.esc p{margin:5px 0 0;color:var(--ink3);font-size:12.5px}
.esc .casc{margin-top:8px}

@media (max-width:1300px){
  .planta{grid-template-columns:270px minmax(0,1fr)}
  .planta .lado.der{display:none}
  .equipo{grid-template-columns:290px minmax(0,1fr)}

/* ===================== Línea de tiempo ===================== */
function initTiempo() {
  $('#plVelo').innerHTML = [1, 2, 4].map(v => `<button data-v="${v}" class="${v === APP.velo ? 'on' : ''}">${v}×</button>`).join('');
  $('#plVelo').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; APP.velo = +b.dataset.v; $('#plVelo').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  const setAnio = (y, completo) => { ST.G.anio = y; APP.recalc(); if (APP.vista === 'planta') { APP.panelDer(); if (completo) APP.panelIzq(); } else if (APP.vista === 'equipo') { renderEquipo(false); lecturas(); } };
  ['#plAnio', '#eqAnio'].forEach(id => $(id).addEventListener('input', ev => setAnio(+ev.target.value)));
  const iconoPlay = on => `<svg viewBox="0 0 16 16">${on ? '<path d="M4 3h3v10H4zM9 3h3v10H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>'}</svg>`;
  const toggle = () => { APP.play = !APP.play; if (APP.play && ST.G.anio >= ST.G.vida - .01) ST.G.anio = 0; ['#plPlay', '#eqPlay'].forEach(id => $(id).innerHTML = iconoPlay(APP.play)); };
  $('#plPlay').onclick = toggle; $('#eqPlay').onclick = toggle;
  let ult = 0;
  const bucle = ts => {
    if (APP.play && ts - ult > 90) {
      const dt = (ts - ult) / 1000; ult = ts;
      let y = ST.G.anio + Math.min(dt, .2) * APP.velo * 1.2;
      if (y >= ST.G.vida) { y = ST.G.vida; toggle(); }
      setAnio(y, false);
    } else if (!APP.play) ult = ts;
    requestAnimationFrame(bucle);
  };
  requestAnimationFrame(bucle);
}

/* ===================== Optimizador ===================== */
function optimizar() {
  const out = [];
  D.piezas.forEach(p => { const r = APP.R.eqs[p.eq].piezas.find(x => x.tag === p.tag); if (r.s === 0) return; const C = candidatos(p.tag).filter(o => o.mejor); out.push({ p, r, c: C[0] || null }); });
  return out;
}

      <td>${m.ssc.tipo === 'LIM' ? [m.ssc.p !== undefined ? `pH₂S ≤ ${m.ssc.p} kPa` : '', m.ssc.T !== undefined ? `T ≤ ${m.ssc.T} °C` : '', m.ssc.pH !== undefined ? `pH ≥ ${m.ssc.pH}` : ''].filter(Boolean).join(' · ') : { A2: 'A.2: ≤ 22 HRC', HIC: 'A.2 + ensayo HIC', NI: 'A.14 (amplios)', NO: 'no aplica' }[m.ssc.tipo]}</td>
      <td>${m.tLoc ? (m.tLoc.cl ? `Cl⁻ ≤ ${m.tLoc.cl} mg/l hasta ${m.tLoc.tcl} °C` : `desaireada ≤ ${m.tLoc.deaer} °C; ${m.tLoc.aer === null ? 'no con O₂' : `con O₂ ≤ ${m.tLoc.aer} °C`}${m.tLoc.noAgua ? '; no en agua producida' : ''}`) : (m.tmax ? `T ≤ ${m.tmax} °C` : 'sobreespesor')}</td>
      <td class="n">${m.E === null ? '—' : fmt(m.E, 2) + ' V'}</td><td class="n">${fmt(m.i, 1)}${m.costoSup ? '*' : ''}</td><td class="n">${m.p} sem</td><td style="max-width:180px">${esc(m.aplica)}</td>
      <td><span class="ref">${esc(m.ref)}</span> <span class="conf ${m.conf}">${{ n: 'norma', t: 'tamizaje', s: 'supuesto' }[m.conf]}</span></td></tr>`).join('')}</tbody></table></div></div>
    <p class="nota" style="margin:6px 0 14px">E galv.: potencial de corrosión en salmuera frente a Ag/AgCl (los mismos valores del simulador del tanque de lavado). * Costo supuesto por este simulador; el resto viene del anexo del acta.</p>
    <div class="rej2"><div class="pnl"><header><h3>PREN de los aceros inoxidables y aleaciones</h3></header><div class="cu sin"><canvas class="ch" id="chPren" style="height:280px;border:0;border-radius:0"></canvas></div></div>
    <div class="pnl"><header><h3>Verificación de los datos</h3></header><div class="cu">${verif.map(([a, b, ok, et]) => `<div class="chk"><span class="dot ${ok === true ? 'd0' : (ok === false ? 'd1' : '')}"></span><span><b style="color:var(--ink)">${esc(a)}</b><br>${esc(b)} <span class="conf ${ok === true ? 'n' : (ok === false ? 't' : 's')}">${et}</span></span></div>`).join('')}</div></div></div>
    <div class="pnl" style="margin-top:14px"><header><h3>Normas usadas</h3></header><div class="cu"><div class="rej2" style="gap:6px 20px">${[
      ['ISO 15156-2', 'Aceros al carbono y de baja aleación en servicio con H₂S: umbral de 0,3 kPa, regiones de severidad, dureza.'],
      ['ISO 15156-3', 'Aleaciones resistentes a la corrosión: límites de T, pH₂S, Cl⁻ y pH por familia (Tablas A.2, A.14, A.24; A.6 para 13Cr).'],
      ['ISO 21457', 'Selección de materiales y sobreespesor: mecanismos (Tabla 2), recipientes (Tabla 4), agua producida (Tabla 6), PREN (Anexo C).'],
      ['ISO 13680', 'Tubulares de CRA: grupos y PREN mínimo (Tabla A.2).'],
      ['ISO 12944', 'Sistemas de pintura y durabilidad de recubrimientos.'],
      ['DNV-RP-B401', 'Diseño de protección catódica y factores de deterioro del recubrimiento.'],
      ['ISO 14692', 'Tubería de GRP/GRE: calificación de presión y temperatura.'],
      ['De Waard, Lotz y Milliams (1991)', 'Velocidad de corrosión por CO₂ y factor de película protectora.']].map(([a, b]) => `<div class="dato" style="display:block"><b style="font-family:var(--cond);font-size:14px">${a}</b><br><span>${b}</span></div>`).join('')}</div></div></div>`;
  const ms = MATS.filter(m => m.pren);
  const cv = $('#chPren'), { c, W, H } = prepCv(cv); c.clearRect(0, 0, W, H);
  const l = 170, bw = (W - l - 30), mx = 50;
  ms.forEach((m, i) => { const y = 20 + i * ((H - 40) / ms.length), h = (H - 40) / ms.length - 8; c.fillStyle = '#e6ecf4'; c.fillRect(l, y, bw, h); const col = m.pren >= 40 ? '#15803d' : (m.pren >= 34 ? '#1f6feb' : (m.pren >= 24 ? '#c77700' : '#f97316')); c.fillStyle = col; c.fillRect(l, y, bw * Math.min(1, m.pren / mx), h); c.fillStyle = '#12233a'; c.font = '12px "Barlow Condensed",sans-serif'; c.textAlign = 'right'; c.fillText(m.n.slice(0, 26), l - 8, y + h / 2 + 4); c.textAlign = 'left'; c.font = '11px "Barlow",sans-serif'; c.fillText(fmt(m.pren, 1), l + bw * Math.min(1, m.pren / mx) + 6, y + h / 2 + 4); });
  [35, 40].forEach(v => { const x = l + bw * v / mx; c.strokeStyle = '#7c3aed'; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(x, 10); c.lineTo(x, H - 14); c.stroke(); c.setLineDash([]); c.fillStyle = '#7c3aed'; c.fillText(`${v}`, x + 3, H - 4); });
}

/* ===================== Página: escenarios ===================== */
function paginaEsc() {
  const Ra = APP.Racta || (APP.Racta = evalTodo(estadoActa(), 0));
  const Ractual = evalTodo(ST, ST.G.anio), RactaY = evalTodo(estadoActa(), ST.G.anio);
  const difG = Object.keys(G_ACTA).filter(k => k !== 'anio' && Math.abs(ST.G[k] - G_ACTA[k]) > 1e-9).map(k => `${k}: ${fmt(G_ACTA[k])} → <b>${fmt(ST.G[k])}</b>`);
  const difE = Object.entries(ST.eq).map(([t, o]) => `${t}: ${Object.entries(o).map(([k, v]) => `${k} ${fmt(k === 'A' ? v * 100 : v)}`).join(', ')}`);
  const difM = Object.entries(ST.mat).map(([t, k]) => `${t}: ${MAT[k].n}`);
  const cambios = D.eq.filter(e => Ractual.eqs[e.tag].s !== RactaY.eqs[e.tag].s);
  const opt = optimizar();
  $('#pagEsc').innerHTML = `<div class="enc"><div><div class="eyebrow">Escenarios</div><h2>Escenarios y configuración ideal</h2><p>Cada escenario parte de la configuración del acta y cambia una o varias condiciones. La cadena muestra cómo el cambio pasa de un equipo a otro.</p></div></div>
    <div class="rej3">${ESC.map(e => `<div class="esc ${e.ideal ? 'ideal' : ''} ${APP.esc === e.k ? 'on' : ''}" data-esc="${e.k}"><h4>${e.ideal ? '<span style="color:var(--ok)">★</span>' : ''}${esc(e.n)}</h4><p>${esc(e.d)}</p>${e.casc ? `<div class="casc">${e.casc.map(x => `<div><span class="fl">→</span><span>${esc(x)}</span></div>`).join('')}</div>` : ''}</div>`).join('')}</div>
    <div class="rej2" style="margin-top:14px">
      <div class="pnl"><header><h3>Escenario actual frente al acta</h3><div class="der"><span class="chip">año ${fmt(ST.G.anio, 1)}</span></div></header><div class="cu">
        <div class="kpis"><div class="kpi ok"><b>${Ractual.c[0]}</b><span>OK (acta ${RactaY.c[0]})</span></div><div class="kpi am"><b>${Ractual.c[1]}</b><span>atención (acta ${RactaY.c[1]})</span></div><div class="kpi ro"><b>${Ractual.c[2]}</b><span>fuera (acta ${RactaY.c[2]})</span></div></div>
        <div class="grp-t">Cambios de condición</div><div class="nota">${difG.concat(difE).join('<br>') || 'Ninguno.'}</div>
        <div class="grp-t">Cambios de material</div><div class="nota">${difM.join('<br>') || 'Ninguno: materiales del acta.'}</div>
        <div class="grp-t">Equipos que cambian de estado</div><div style="display:grid;gap:4px">${cambios.length ? cambios.map(e => `<div class="alerta s${Ractual.eqs[e.tag].s}" data-ir="${e.tag}" style="padding:5px 8px"><div><b style="font-size:13px">${e.tag}</b> <span class="pill p${RactaY.eqs[e.tag].s}">${NOM[RactaY.eqs[e.tag].s]}</span> → <span class="pill p${Ractual.eqs[e.tag].s}">${NOM[Ractual.eqs[e.tag].s]}</span></div></div>`).join('') : '<p class="nota">Ninguno.</p>'}</div>
      </div></div>
      <div class="pnl"><header><h3>Configuración óptima para este escenario</h3><div class="der">${opt.some(o => o.c) ? '<button class="btn pri sm" id="optAp">Aplicar todo</button>' : ''}</div></header><div class="cu">
        <p class="nota" style="margin-top:0">Para cada pieza fuera de la envolvente, el material más económico que cumple en las condiciones actuales.</p>
        ${opt.length ? `<div class="tw"><table><thead><tr><th>Pieza</th><th>Estado</th><th>Propuesta</th><th class="n">Costo</th><th class="n">Plazo</th></tr></thead><tbody>${opt.map(o => `<tr><td><b>${o.p.tag}</b><br><span class="ref">${esc(o.p.pieza.slice(0, 40))}</span></td><td><span class="pill p${o.r.s}">${NOM[o.r.s]}</span></td><td>${o.c ? esc(o.c.n) + (o.c.ca ? ` (${fmt(o.c.ca, 1)} mm)` : '') : '<span style="color:var(--ro2)">Ningún material cumple: cambiar la condición</span>'}</td><td class="n">${o.c ? fmt(o.c.i, 1) : '—'}</td><td class="n">${o.c ? o.c.pl + ' sem' : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="aviso info">Todas las piezas están dentro de la envolvente: la configuración actual ya es válida.</div>'}
      </div></div></div>`;
  $('#pagEsc').querySelectorAll('[data-esc]').forEach(b => b.onclick = () => APP.aplicarEsc(b.dataset.esc));
  $('#pagEsc').querySelectorAll('[data-ir]').forEach(b => b.onclick = () => abrirEquipo(b.dataset.ir));
  const ap = $('#optAp'); if (ap) ap.onclick = () => { opt.forEach(o => { if (!o.c) return; ST.mat[o.p.tag] = o.c.k; if (o.c.ca) ST.pz[o.p.tag] = Object.assign(ST.pz[o.p.tag] || {}, { ca: o.c.ca }); }); APP.cambio('Optimización de materiales'); };
}

/* ===================== Página: informe ===================== */
function paginaInf() {
  const R = APP.R, e = ESC.find(x => x.k === APP.esc), opt = optimizar();
  const malos = D.piezas.map(p => R.eqs[p.eq].piezas.find(x => x.tag === p.tag)).filter(r => r.s > 0).sort((a, b) => b.s - a.s);
  const html = `<div class="enc"><div><div class="eyebrow">Informe</div><h2>Informe del escenario</h2><p>${esc(e ? e.n : 'Escenario modificado')} · año ${fmt(ST.G.anio, 1)} de ${ST.G.vida}</p></div><div style="margin-left:auto"><button class="btn pri" id="infImp">Imprimir o guardar en PDF</button></div></div>
    <div class="kpis" style="max-width:520px"><div class="kpi ok"><b>${R.c[0]}</b><span>piezas OK</span></div><div class="kpi am"><b>${R.c[1]}</b><span>atención</span></div><div class="kpi ro"><b>${R.c[2]}</b><span>fuera</span></div></div>
    <div class="pnl" style="margin-top:14px"><header><h3>Piezas que requieren acción</h3></header><div class="tw"><table><thead><tr><th>Pieza</th><th>Equipo</th><th>Estado</th><th>Qué falla</th><th>Propuesta del simulador</th></tr></thead><tbody>
    ${malos.length ? malos.map(r => { const o = opt.find(x => x.p.tag === r.tag); return `<tr><td><b>${r.tag}</b><br><span class="ref">${esc(r.p.pieza.slice(0, 50))}</span></td><td>${r.p.eq}</td><td><span class="pill p${r.s}">${NOM[r.s]}</span></td><td>${r.checks.filter(c => c.s > 0).map(c => esc(c.txt)).join('<br>')}</td><td>${o && o.c ? esc(o.c.n) : 'Cambiar la condición de operación'}</td></tr>`; }).join('') : '<tr><td colspan="5">Ninguna: todo dentro de la envolvente.</td></tr>'}
    </tbody></table></div></div>
    <p class="nota">Cálculo de tamizaje con las ecuaciones y supuestos del acta (SD-01 a SD-12) y los límites de materiales de la página Materiales y normas. Los criterios marcados como tamizaje deben confirmarse en la norma antes de decidir. Documento para revisión, sin firma.</p>`;
  $('#pagInf').innerHTML = html;
  $('#infImp').onclick = () => {
    const w = window.open('', '_blank'); if (!w) return;
    w.document.write(`<!doctype html><meta charset=utf-8><title>Informe de escenario · Proyecto A</title><style>body{font-family:Georgia,serif;margin:28px 38px;color:#12233a;font-size:13px}h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 6px;color:#0b3a73}table{border-collapse:collapse;width:100%}td,th{border:1px solid #c9d4e3;padding:4px 7px;vertical-align:top;font-size:12px;text-align:left}th{background:#eef3fa}.n{color:#586b82;font-size:11.5px}@media print{@page{size:A4;margin:14mm}}</style>
      <h1>Informe de escenario · Proyecto A</h1><div class=n>Simulador de planta · Ing. J. Gabriel Franco · ${new Date().toLocaleDateString('es-CO')}</div>
      <h2>Escenario</h2><div>${esc(e ? e.n : 'Escenario modificado')}; año ${fmt(ST.G.anio, 1)}; H₂S hoy ${fmt(ST.G.H2Shoy)} % y al año 10 ${fmt(ST.G.H2S10)} %; CO₂ ${fmt(ST.G.CO2)} %; pH ${fmt(ST.G.pH)}; Cl⁻ ${fmt(ST.G.Cl, 0)} mg/l; ${ST.G.npozos} pozos; corte de agua ${ST.G.bsw} %.</div>
      <h2>Efectos en cadena</h2><div>${Object.entries(R.her).map(([t, v]) => Object.entries(v).map(([k, x]) => `${x.de} → ${t}: ${k} ${fmt(k === 'A' ? x.v * 100 : x.v)} (${esc(x.por)})`).join('<br>')).join('<br>') || 'Ninguno.'}</div>
      <h2>Resultado</h2><div>${R.c[0]} piezas en envolvente, ${R.c[1]} con atención y ${R.c[2]} fuera, de ${D.piezas.length}.</div>
      <h2>Piezas que requieren acción</h2><table><tr><th>Pieza</th><th>Estado</th><th>Qué falla</th><th>Propuesta</th></tr>${malos.map(r => { const o = opt.find(x => x.p.tag === r.tag); return `<tr><td><b>${r.tag}</b> ${esc(r.p.pieza.slice(0, 50))}</td><td>${NOM[r.s]}</td><td>${r.checks.filter(c => c.s > 0).map(c => esc(c.txt)).join('<br>')}</td><td>${o && o.c ? esc(o.c.n) : 'Cambiar la condición'}</td></tr>`; }).join('')}</table>
      <p class=n>Cálculo de tamizaje con los supuestos del acta. Documento para revisión, sin firma.</p><script>setTimeout(function(){window.print()},400)<\/script>`);
    w.document.close();
  };
}

/* ===================== Página: mecanismos por equipo ===================== */
function paginaMec() {
  const R = APP.R, eqLink = l => l.split(' ').map(t => EQ[t] ? `<a href="#" data-ir="${t}">${t}</a>` : t).join(' ');
  const otros = ['A1', 'A2'].map(s => `<div class="pnl"><header><h3 style="color:${SIS[s]}">${SIS_NOM[s]}</h3></header><div class="cu" style="display:flex;flex-wrap:wrap;gap:6px">${D.eq.filter(e => e.sistema === s).map(e => `<button class="btn sm" data-ir="${e.tag}"><span class="dot d${R.eqs[e.tag].s}"></span>${e.tag}</button>`).join('')}</div></div>`).join('');
  $('#pagMec').innerHTML = `<div class="enc"><div><div class="eyebrow">Corrosión por equipo</div><h2>Qué mecanismo ataca a cada equipo, y cuándo</h2><p>Veredicto del cribado del sistema A3 (informe, sección 4) junto al estado que calcula el simulador con las condiciones actuales. Clic en un equipo para abrir su simulador y su ficha de corrosión.</p></div></div>
    <div class="pnl"><header><h3>Mapa de equipos y mecanismos · A3</h3><div class="der"><span class="mc mcC">Crítico</span><span class="mc mcA">Aplica</span><span class="mc mcK">Condicional</span></div></header><div class="tw"><table class="mapa"><thead><tr><th>Equipo</th>${MEC_COLS.map(m => `<th>${m}</th>`).join('')}<th>Mecanismo dominante</th><th>Ahora</th></tr></thead><tbody>
    ${Object.keys(MAPA).map(t => `<tr data-ir="${t}" style="cursor:pointer"><td><b>${t}</b><br><span class="ref">${esc(EQ[t].nombre.slice(0, 34))}</span></td>${MAPA[t].split('').map(c => `<td class="cel"><span class="mc mc${c}">${MC_NOM[c] || '·'}</span></td>`).join('')}<td>${esc(FICHAS[t].mec)}</td><td><span class="pill p${R.eqs[t].s}">${NOM[R.eqs[t].s]}</span></td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="pnl" style="margin-top:14px"><header><h3>Índice por mecanismo</h3></header><div class="tw"><table><thead><tr><th>Mecanismo</th><th>Equipos donde es crítico</th><th>Equipos donde aplica o es condicional</th><th>Condición que lo activa</th><th>Cláusula</th></tr></thead><tbody>
    ${INDICE_MEC.map(([m, c, a, cond, cl]) => `<tr><td><b>${m}</b></td><td>${c ? eqLink(c) : '—'}</td><td>${eqLink(a)}</td><td>${esc(cond)}</td><td><span class="ref">${esc(cl)}</span></td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="rej2" style="margin-top:14px">${otros}</div>
    <p class="nota" style="margin-top:8px">A1 y A2 son de los otros equipos del proyecto: se muestran con su estado en vivo y la pestaña "Ficha de corrosión" lista los mecanismos del acta por pieza.</p>`;
  $('#pagMec').querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); abrirEquipo(b.dataset.ir); EQV.tab = 'fic'; renderTab(); }));
}

/* ===================== Arranque ===================== */

const equipmentTabs = $('#equipmentTabs');
equipmentTabs.innerHTML = D.eq.map(e =>
  '<button type="button" data-equipment="' + e.tag + '" title="' + esc(e.nombre) + '">' + e.tag + '</button>').join('');
equipmentTabs.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (button) abrirEquipo(button.dataset.equipment);
});
const scenarioSelect = $('#equipmentScenario');
scenarioSelect.innerHTML = ESC.map(e => '<option value="' + e.k + '">' + esc(e.n) + '</option>').join('')
  + '<option value="" disabled>Escenario modificado</option>';
scenarioSelect.onchange = () => APP.aplicarEsc(scenarioSelect.value);
ESC[0].f(ST);
APP.recalc();
const initialEquipment = new URLSearchParams(location.search).get('equipo');
abrirEquipo(D.eq.some(e => e.tag === initialEquipment) ? initialEquipment : D.eq[0].tag);
initEquipo();
initTiempo();
new ResizeObserver(() => {
  if ($('#cvEq').clientWidth >= 180) {
    vidaChart();
    renderTab();
  }
}).observe($('#cvEq'));

</script>
