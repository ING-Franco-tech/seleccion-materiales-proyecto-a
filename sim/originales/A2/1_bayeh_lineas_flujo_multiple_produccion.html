  return Math.max(0.3, Math.pow(10, pH - slope));

<script>
/* ===================== MOTOR DE CÁLCULO (puro, sin DOM) ===================== */
'use strict';
const WALL_FL = { '40': 6.02, '80': 8.56, '160': 13.49 };                 // NPS 4, ASME B36.10M (NO VERIFICADO: norma no adjunta)
const WALL_MP = { '40': 9.27, 'XS': 12.70, '80': 15.09, '120': 21.44 };   // NPS 10, ASME B36.10M (NO VERIFICADO)
const FLANGE600 = [[38, 102.1], [50, 100.2], [100, 93.2], [150, 90.2], [200, 87.6]]; // ASME B16.5 Tabla 2-1.1 grupo 1.1 (NO VERIFICADO: norma no adjunta)

function defaultState() {
  return {
    caso: 'hoy', inhib: true, nWells: 8, scope: 'both',
    P_head: 45, P_arr: 45, T_in: 68, T_out: 68, T_max: 85,
    co2: 3.1, h2s_hoy: 0.15, h2s_y10: 0.3, pH: 4.6, cl: 42000, wc: 78, sand: 12, orgAc: 220,
    life: 20, crU: 0.31, crI: 0.1, availAlt: 75, fpH: 0, cuScale: 1,
    OD_fl: 114.3, sch_fl: '80', L_fl: 1850, v_fl: 1.8,
    DN_mp: 250, OD_mp: 273.1, sch_mp: '80',
    rho: 850, mu: 5, rough: 0.046, Ccoef: 100, vmin: 1.0,
    S_allow: 138, E: 1.0, W: 1.0, Y: 0.4, tol: 12.5,
    R3: 12.6, sensMetric: 'marginFL', cp: -980,
    a: { avail90: true, base031: true, pdes50: true, tmp52: false, selA2: true, tol125: true, h2s030: true, inhTLC: false }
  };
}
const clone = o => JSON.parse(JSON.stringify(o));

function dewaard(T, pCO2, fpH) {            // log10 V = 5.8 − 1710/(T+273,15) + 0,67 log10 pCO2 − F(pH)   [informe, §11.1.2]
  return Math.pow(10, 5.8 - 1710 / (T + 273.15) + 0.67 * Math.log10(pCO2) - (fpH || 0));
}
function interp(tab, x) {
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) if (x <= tab[i][0]) {
    const [x0, y0] = tab[i - 1], [x1, y1] = tab[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return tab[tab.length - 1][1];
}
function mech(OD, wall, CA, Pbar, S, tol) {   // ASME B31.3 (3a): t = P·D / (2(S·E·W + P·Y))  — NO VERIFICADO contra texto
  const P = Pbar / 10, SEW = S.S_allow * S.E * S.W;
  const t = P * OD / (2 * (SEW + P * S.Y)), tm = t + CA;
  const wmin = wall * (1 - tol / 100), trem = wmin - CA;
  const mawp = tt => tt > 0 ? 10 * 2 * SEW * tt / (OD - 2 * S.Y * tt) : 0;
  return { t, tm, tnomReq: tm / (1 - tol / 100), wall, wmin, trem, margin: wmin - tm, ok: wmin >= tm,
           mawpNew: mawp(wmin), mawpEol: mawp(trem), util: tm / wmin };
}
function minSch(tab, tnomReq) {
  const e = Object.entries(tab).sort((a, b) => a[1] - b[1]).find(([, w]) => w >= tnomReq);
  return e ? e[0] : null;
}
function hyd(Dm, v, S, L) {
  const A = Math.PI / 4 * Dm * Dm, Q = A * v, mu = S.mu / 1000;
  const Re = S.rho * v * Dm / mu, eps = S.rough / 1000;
  const f = Re < 2300 ? 64 / Re : 0.25 / Math.pow(Math.log10(eps / (3.7 * Dm) + 5.74 / Math.pow(Re, 0.9)), 2);
  const dP = L ? f * L / Dm * S.rho * v * v / 2 / 1e5 : null;
  const rhoLb = S.rho * 0.062428, veFt = S.Ccoef / Math.sqrt(rhoLb), ve = veFt * 0.3048;   // API RP 14E: Ve = C/√ρ  (NO VERIFICADO)
  return { Dm, A, Q, Qh: Q * 3600, bpd: Q * 86400 * 6.28981, Re, f, dP, ve, ratio: v / ve, v };
}

function compute(S) {
  const a = S.a, R = {};
  R.Pdes = a.pdes50 ? 50 : 55;
  R.T_mp = a.tmp52 ? 52 : S.T_out;
  R.avail = a.avail90 ? 0.95 : S.availAlt / 100;
  R.model = a.base031 ? 'cliente' : 'dewaard';
  R.tol = a.tol125 ? S.tol : 15;
  R.y = (S.caso === 'y10' && a.h2s030) ? S.h2s_y10 : S.h2s_hoy;
  const pt = (P, T) => ({ P, T, pCO2: S.co2 / 100 * P, pH2S_bar: R.y / 100 * P, pH2S_kPa: R.y / 100 * P * 100 });
  R.pts = { entry: pt(S.P_head, S.T_in), arr: pt(S.P_arr, S.T_out), mp: pt(S.P_arr, R.T_mp) };
  R.pts.mp8 = pt(S.P_arr, S.T_max);

  /* ---- Corrosión interna CO2 ---- */
  const corr = p => {
    const dw = dewaard(p.T, p.pCO2, S.fpH) * S.cuScale;
    const cu = (R.model === 'cliente' ? S.crU * S.cuScale : dw), ci = S.crI;
    const effInh = cu * (1 - R.avail) + ci * R.avail;                       // fórmula ficha E1-03
    return { dw, cu, ci, effInh, eff: S.inhib ? effInh : cu, informe: cu * (1 - R.avail),   // informe §11.1.3: Vu·(1−E)
             caInh: effInh * S.life, caNo: cu * S.life, ca: (S.inhib ? effInh : cu) * S.life, caInforme: cu * (1 - R.avail) * S.life };
  };
  R.cFL = corr(R.pts.entry); R.cMP = corr(R.pts.mp);
  R.cClient = { cu: S.crU * S.cuScale, effInh: S.crU * S.cuScale * (1 - R.avail) + S.crI * R.avail };
  R.dw = { in68: dewaard(68, S.co2 / 100 * 45, S.fpH), in85: dewaard(85, S.co2 / 100 * 45, S.fpH),
           arr52: dewaard(52, S.co2 / 100 * 38, S.fpH), mp: dewaard(R.T_mp, S.co2 / 100 * 38, S.fpH) };
  R.ratioDW = R.dw.in68 / S.crU;
  R.profile = [];
  for (let i = 0; i <= 20; i++) {
    const x = i / 20, T = S.T_in + (S.T_out - S.T_in) * x, P = S.P_head + (S.P_arr - S.P_head) * x;
    R.profile.push({ x: x * S.L_fl, T, P, dw: dewaard(T, S.co2 / 100 * P, S.fpH) * S.cuScale, cl: S.crU * S.cuScale });
  }

  /* ---- Servicio amargo (ISO 15156-2) ---- */
  S.R3 = isoPressureLimit(S.pH, 2);
  const reg = k => getISO15156Region(k, S.pH);
  const ssc = p => ({ kPa: p.pH2S_kPa, reg: reg(p.pH2S_kPa), times: p.pH2S_kPa / 0.3, margin: (S.R3 - p.pH2S_kPa) / S.R3,
                      ratio: p.pH2S_bar > 0 ? p.pCO2 / p.pH2S_bar : Infinity });
  R.ssc = { entry: ssc(R.pts.entry), arr: ssc(R.pts.arr) };
  R.ssc.gov = a.selA2 ? R.ssc.arr : R.ssc.entry;
  R.ssc.worst = Math.max(R.ssc.entry.reg, R.ssc.arr.reg);
  R.sscGrid = [0.15, 0.30].map(yy => [38, 45].map(P => ({ y: yy, P, kPa: yy / 100 * P * 100, reg: reg(yy / 100 * P * 100) }))).flat();
  R.hardness = R.ssc.worst === 3 ? { weld: 250, route: 'A.2 (obligatoria en Región 3, 7.2.1.4)' } : { weld: 280, route: 'A.2 (250 HV) o A.3.3 (≈280 HV típico)' };

  /* ---- Hidráulica ---- */
  const wFL = WALL_FL[S.sch_fl], wMP = WALL_MP[S.sch_mp];
  R.wFL = wFL; R.wMP = wMP;
  R.hFL = hyd((S.OD_fl - 2 * wFL) / 1000, S.v_fl, S, S.L_fl);
  R.Pcalc = S.P_head - R.hFL.dP;
  const n = Math.max(1, Math.min(8, S.nWells));
  const Qtot = n * R.hFL.Q, DmMP = (S.OD_mp - 2 * wMP) / 1000, Amp = Math.PI / 4 * DmMP * DmMP, vMP = Qtot / Amp;
  R.hMP = hyd(DmMP, vMP, S, null); R.hMP.Qtot = Qtot; R.hMP.Qh = Qtot * 3600; R.hMP.bpd = Qtot * 86400 * 6.28981; R.hMP.n = n;
  R.sand = { lbd: R.hFL.bpd * S.sand / 1000, kgd: R.hFL.bpd * S.sand / 1000 * 0.4536, lbdMP: R.hMP.bpd * S.sand / 1000 };
  R.vMPlow = vMP < S.vmin;

  /* ---- Integridad mecánica ---- */
  R.mFL = mech(S.OD_fl, wFL, R.cFL.ca, R.Pdes, S, R.tol);
  R.mMP = mech(S.OD_mp, wMP, R.cMP.ca, R.Pdes, S, R.tol);
  R.mFLno = mech(S.OD_fl, wFL, R.cFL.caNo, R.Pdes, S, R.tol);
  R.mFLinh = mech(S.OD_fl, wFL, R.cFL.caInh, R.Pdes, S, R.tol);
  R.mFL.minSch = minSch(WALL_FL, R.mFL.tnomReq); R.mMP.minSch = minSch(WALL_MP, R.mMP.tnomReq);

function corrAt(p) {
  const dw = dewaard(p.T, p.pCO2, S.fpH) * S.cuScale, cu = R.model === 'cliente' ? S.crU * S.cuScale : dw, ci = S.crI;
  const effInh = cu * (1 - R.avail) + ci * R.avail;
  return { dw, cu, ci, effInh, informe: cu * (1 - R.avail), ca: (S.inhib ? effInh : cu) * S.life };
}
function corrWith(model) { const S2 = clone(S); S2.a.base031 = model === 'cliente'; return compute(S2); }

function stackBar(m, label) {
  const tp = m.t, ca = Math.max(0, m.tm - m.t), tolr = m.wall - m.wmin, tot = Math.max(m.wall, m.tm + tolr) * 1.02, W = 600, X = v => v / tot * (W - 20) + 10;
  const parts = [[tp, 'var(--accent)', 'Presión (t)'], [ca, 'var(--apl)', 'CA'], [Math.max(0, m.margin), 'var(--ok)', 'Margen'], [tolr, 'var(--nv)', 'Tolerancia de fabricación']];
  let x = 10, s = `<svg viewBox="0 0 ${W} 74" role="img" aria-label="Desglose de pared ${esc(label)}">`;
  parts.forEach(([v, c]) => { if (v > 0) { s += `<rect x="${x}" y="14" width="${X(v) - 10}" height="28" fill="${c}"/>`; x += X(v) - 10; } });
  if (m.margin < 0) s += `<rect x="${x}" y="14" width="${X(-m.margin) - 10}" height="28" fill="var(--crit)" opacity=".55" stroke="var(--crit)" stroke-dasharray="4 3"/>`;
  s += `<line x1="${X(m.wall)}" x2="${X(m.wall)}" y1="6" y2="50" stroke="var(--ink)" stroke-width="2"/><text x="${X(m.wall)}" y="64" text-anchor="end" font-size="11" fill="var(--ink)">pared nominal ${fmt(m.wall)} mm</text></svg>`;
  return s + legendHtml(parts.map(p => [p[1], p[2]]).concat(m.margin < 0 ? [['var(--crit)', 'Déficit']] : []));
}
function mechCard(nm, m, OD, tab, sch, caSrc) {

  <div class="tw"><table>
   <tr><td>Diámetro exterior / pared nominal</td><td class="n">${f(OD, 1)} mm / ${f(m.wall)} mm (Sch ${sch})</td></tr>
   <tr><td>Presión de diseño P</td><td class="n">${R.Pdes} bar = ${f(R.Pdes / 10, 1)} MPa</td></tr>
   <tr><td>S·E·W / Y</td><td class="n">${f(S.S_allow * S.E * S.W, 1)} MPa / ${S.Y}</td></tr>
   <tr><td>t = P·D / [2(S·E·W + P·Y)]</td><td class="n">${f(m.t)} mm</td></tr>
   <tr><td>Sobreespesor de corrosión CA (${caSrc})</td><td class="n">${f(m.tm - m.t)} mm</td></tr>
   <tr><td><b>Espesor mínimo requerido t_m = t + CA</b></td><td class="n"><b>${f(m.tm)} mm</b></td></tr>
